# ========================================================
# Render Infrastructure Blueprint for StaffPulse
# https://render.com/docs/blueprint-spec
# ========================================================

databases:
  # 1. Managed PostgreSQL Database
  - name: staffpulse-db
    databaseName: staffpulse_db
    user: staffpulse_user
    plan: free
    region: oregon # or frankfurt, singapore, ohio

services:
  # 2. Python FastAPI Backend Service
  - type: web
    name: staffpulse-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: staffpulse-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000

  # 3. React Frontend Static Site
  - type: static
    name: staffpulse-frontend
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: staffpulse-backend
          property: host

